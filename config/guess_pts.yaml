# ════════════════════════════════════════════════════════════════════════════
# guess_pts_strategic.yaml — RMUC2026 基于战略要害的猜点表
#
# 设计思路:
#   1. 不逐个遮挡列点, 而是按"兵种战术习惯 + 战略要害"列点
#   2. 哨兵 R7/B7 ★★★ 2026 规则: 无轨道限制 ★★★ → 全场任意走, 候选点覆盖己方全场
#   3. 英雄候选点都在敌方区域 (因为英雄在敌方被遮挡时才需要猜)
#   4. 步兵 R3/R4 同模板, 但点位略错开避免双步兵 ID 误绑
#   5. 蓝方 = 红方关于场地中心 (14, 7.5) 对称
#
# 战略要害 (RMUC2026 场地, 红方原点, 单位 m):
#   补给区 (CHARGING): 红 (3, 3.5)/(3, 11.5)  蓝 (25, 3.5)/(25, 11.5)
#   基地中心: 红 (3, 7.5)                     蓝 (25, 7.5)
#   堡垒中心: 红 (6.60, 7.50)                  蓝 (21.40, 7.50)
#   前哨: 红 (9.20, 7.50)                      蓝 (18.80, 7.50)
#   self_tower: (10.82, 3.66, 1.87m高)        ← 下侧塔, 阴影向下方
#   cross_tower: (17.18, 11.34, 1.87m高)      ← 上侧塔, 阴影向上方
#   中央装配区/能量机关: (14, 7.5)             ← 取碎片争夺核心
#   中央高台斜坡: x=9.2-18.8, y=5-10           ← 步兵高地
#   红梯形高地: (4, 11.5)                      蓝梯形高地: (24, 3.5)
#   红隧道出口: (12, 3.8)/(12, 11.2)           蓝隧道出口: (16, 3.8)/(16, 11.2)
#
# 算法: cos·cos_sim + (1-cos)·exp(-dist·d_factor) (HKUST Algorithm 2)
# ════════════════════════════════════════════════════════════════════════════

d_factor: 0.08
cos_factor: 0.20
snap_max: 0.60
snap_ramp: 0.15
snap_start_s: 1.2

guess_points:

  # ═══ 红方 (己方) — 候选点都在蓝方区域 (敌方区域被遮挡时才需要猜) ═══

  # R1 红英雄 — 战术: 红前哨后远射 + 蓝基地周围 360° 偷家预警
  # ★ 真实规则 (规则手册 V1.4.2 表 5-2): 基地 6 块装甲都掉血
  #   42mm 弹丸打任意一块装甲 → 200 伤害 → 一炮秒基地 (基地总血 200)
  #   17mm 弹丸: 上方前装甲扣 5/发, 其余 5 块扣 20/发 (后侧装甲反而更脆)
  #   所以英雄从任意角度都能秒, 偷家预警必须 360° 覆盖蓝基地 (25, 7.5)
  R1:
    # ── ⭐ 主战术 A: 红前哨周围 4 斜角 (避正后方挡视线, 斜角才能看到敌方基地) ─
    #   英雄不在前哨正后方 (y=7.5), 而是斜对角分布: 西南/东南/西北/东北
    - [ 8.50,  6.50]   # 2 东南斜 (近前哨, 小斜角)
    - [ 8.50,  8.50]   # 3 东北斜 (近前哨, 小斜角)
    # ── ⭐ 主战术 B: 借中央高地多边形顶点掩护 ─────────────────────────────
    #   中央高地不规则多边形, 英雄站八角形顶点外侧, 避开台阶入口和隧道口
    - [10.00,  3.00]   # 借 self_tower 南面 + 高地西南顶点掩护
    - [10.00,  4.50]   # 高地西南顶点外 (避开下隧道 y=3-4.5)
    - [10.50, 10.50]   # 高地西北顶点外 (避开上隧道 y=10.5-12)
    # ── ⭐ 主战术 C: 红堡垒后 + 红方梯形高地 ─────────────────────────────
    - [ 4.50,  6.50]   # 红堡垒后偏下 (避正后方挡视线)
    - [ 11.50,  12.00]   # 红堡垒后偏上
    - [ 4.00, 12.50]   # ⭐ 红方梯形高地 (高位俯射)
    # ── ⚠ 偷家蓝基地 (25, 7.5) 周围 4 斜角 (高威胁预警) ───────────────────
    - [23.00,  5.50]   # ⚠ 西南斜
    - [23.00,  9.50]   # ⚠ 西北斜
    - [27.00,  5.50]   # ⚠ 东南斜
    - [27.00,  9.50]   # ⚠ 东北斜
    # ── 过渡位 ─────────────────────────────────────────────────────────
    - [12.00,  7.50]   # 中央装配区附近 (进攻途中)

  # R2 红工程 — 战术: 取能量单元 (资源站) → 运矿 → 装配区 (中央高地 z=0.6m)
  # 规则手册 4.2.6: 资源站在补给区内, 6 个能量单元磁吸放置, 工程取出装配
  # ★ 装配区在中央高地上 (z=0.6m), 工程上高台站位装配
  R2:
    # ── ⭐ 取矿区 (红资源站, 镜像 B2) ─────────────────────────────────────
    - [ 3.00,  3.50]   # 红补给南
    - [ 2.50,  1.50]   # 红补给南 (CHARGING)
    # ── ⭐ 运矿路径 ───────────────────────────────────────────────────────
    - [ 7.00,  5.50]   # 下路运矿中转
    - [ 7.00,  9.50]   # 上路运矿中转
    - [ 9.00,  6.50]   # 装配区前 (下路接近)
    - [ 9.00,  8.50]   # 装配区前 (上路接近)
    # ── ⭐ 装配区 (中央高地, 镜像 B2) ─────────────────────────────────────
    - [13.50,  8.00]   # ⭐ 装配区中心
    - [13.00,  7.50]   # EM 柱 1 装配位
    - [14.00,  8.50]   # 装配区北斜角

  # R3 红步兵 — 战术: 中央高台 + 隧道穿插 + 中场对抗
  R3:
    - [12.50,  7.00]   # ⭐ 中央高台斜坡盲区
    - [13.50, 13.20]   # 红隧道顶-出口
    - [14.50, 2.00]   # 蓝隧道底-出口 (攻入)
    - [16.00, 11.20]   # 蓝隧道顶-出口
    - [ 4.00, 11.50]   # 红梯形高地 (高地占位)
    - [13.50,  8.50]   # EM 柱后方中场
    - [6.50,  3.00]   # EM 柱后方中场
    - [8.30,  7.50]   # EM 柱后方中场
    - [17.50,  2.70]   # EM 柱后方中场

  # R4 红步兵 — 战术同 R3, 点位错开避免双步兵 ID 误绑
  R4:
    - [12.50,  7.00]   # ⭐ 中央高台斜坡盲区
    - [13.50, 13.20]   # 红隧道顶-出口
    - [14.50, 2.00]   # 蓝隧道底-出口 (攻入)
    - [16.00, 11.20]   # 蓝隧道顶-出口
    - [ 4.00, 11.50]   # 红梯形高地 (高地占位)
    - [13.50,  8.50]   # EM 柱后方中场
    - [6.50,  3.00]   # EM 柱后方中场
    - [8.30,  7.50]   # EM 柱后方中场
    - [17.50,  2.70]   # EM 柱后方中场

  # R7 红哨兵 — ★★ 2026 规则: 无轨道限制 ★★ 全场战术
  # 战术: 守家 + 中场骚扰 + 偷家进攻 (相比 2025 更激进)
  R7:
    - [ 7.00,  7.50]   # ⭐ 红堡垒中心 (防守核心)
    - [ 4.00,  8.10]   # 红基地中央 (守家)
    - [ 4.00,  12.50]   # 红基地中央 (守家)
    - [ 9.00,  9.50]   # 红前哨附近巡视
    - [12.50,  7.50]   # 中央高台 (占领中场)
    - [ 4.00, 11.50]   # 红梯形高地 (高位反击)
    - [ 10.00,  11.00]   # 红下路巡视
    - [ 7.00, 11.00]   # 红上路巡视
    - [6.50,  3.00]   # EM 柱后方中场
    - [8.20,  8.50]   # 红基地中央 (守家)
   

  # ═══ 蓝方 (敌方) — 关于场地中心 (14, 7.5) 对称: x→28-x, y→15-y ═══

