    - [19.50,  6.50]   # 西南斜 (近前哨)
    # ── ⭐ 主战术 B: 借中央高地多边形顶点掩护 (镜像 R1) ───────────────────
    - [18.00, 12.00]   # 借 cross_tower 北面 + 高地东北顶点掩护
    - [18.00, 10.50]   # 高地东北顶点外 (避开上隧道)
    - [17.50,  4.50]   # 高地东南顶点外 (避开下隧道)
    # ── ⭐ 主战术 C: 蓝堡垒后 + 蓝方梯形高地 (镜像 R1) ────────────────────
    - [23.50,  8.50]   # 蓝堡垒后偏上
    - [16.50,  3.00]   # 蓝堡垒后偏下
    - [24.00,  2.50]   # ⭐ 蓝方梯形高地 (高位俯射)
    # ── ⚠ 偷家红基地 (3, 7.5) 周围 4 斜角 (高威胁预警, 镜像 R1) ─────────────
